plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.owngame.helpi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.owngame.helpi'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

dependencies {
    // Android-native ONNX Runtime: replaces the Windows-only DirectML runtime.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}
